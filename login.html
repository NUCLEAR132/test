<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ====== المتغيرات العامة (الوضع الفاتح الكلاسيكي) ====== */
        :root {
            --primary: #2563eb;        /* الأزرق الملكي */
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --bg: #f1f5f9;             /* خلفية رمادية فاتحة جداً */
            --card: #ffffff;
            --text: #1e293b;
            --text-2: #64748b;
            --border: #e2e8f0;
            --red: #ef4444;
            --green: #22c55e;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* ====== الوضع المظلم (ألوان كلاسيكية أنيقة - أزرق داكن) ====== */
        html[data-theme="dark"] {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #1e3a8a;
            --bg: #0f172a;             /* أزرق داكن جداً */
            --card: #1e293b;           /* أزرق رمادي */
            --text: #f1f5f9;
            --text-2: #94a3b8;
            --border: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
        }

        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ====== بطاقة تسجيل الدخول ====== */
        .login-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow);
            transition: background 0.3s ease, border 0.3s ease;
        }

        .login-mark img {
            width: 64px;
            height: 64px;
            background: var(--primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.8rem;
            margin: 0 auto 20px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            object-fit: cover; /* لضمان ظهور الصورة بشكل جيد */
        }

        .login-title {
            text-align: center;
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 6px;
            color: var(--text);
        }

        .login-sub {
            text-align: center;
            color: var(--text-2);
            font-size: 0.85rem;
            margin-bottom: 28px;
        }

        /* ====== حقول الإدخال ====== */
        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 8px;
        }

        .input-wrap { position: relative; }

        .form-control {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 13px 44px 13px 16px;
            border-radius: 10px;
            font-size: 0.92rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background: var(--bg);
            color: var(--text);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .form-control::placeholder {
            color: var(--text-2);
            opacity: 0.6;
        }

        .toggle-eye {
            position: absolute;
            top: 50%;
            left: 14px;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-2);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }

        .toggle-eye:hover { color: var(--primary); }

        /* ====== زر الدخول ====== */
        .btn-login {
            background: var(--primary);
            border: none;
            color: #fff;
            padding: 13px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            width: 100%;
            margin-top: 20px;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn-login:hover {
            background: var(--primary-dark);
            color: #fff;
        }

        .btn-login:active { transform: scale(0.98); }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ====== رسائل التنبيه ====== */
        .msg {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .msg.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: var(--red);
            display: block;
        }

        .msg.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.25);
            color: var(--green);
            display: block;
        }

        /* ====== زر تبديل الوضع المظلم ====== */
        .theme-toggle {
            position: fixed;
            top: 24px;
            left: 24px;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* ====== تذييل بسيط ====== */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-2);
        }

        /* ====== الاستجابة ====== */
        @media (max-width: 480px) {
            .login-box { padding: 30px 22px; }
            .login-title { font-size: 1.1rem; }
            .login-mark img { width: 56px; height: 56px; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeToggle" title="تبديل الوضع">
        <i class="bi bi-moon-stars" id="themeIcon"></i>
    </button>

    <div class="login-box">
        <!-- الشعار: نستخدم logo_light و logo_dark القادمين من Flask -->
        <div class="login-mark">
            <img src="{{ logo_light }}" alt="Logo" id="loginLogo"
                 data-light="{{ logo_light }}" data-dark="{{ logo_dark }}">
        </div>
        <div class="login-title">تسجيل الدخول</div>
        <div class="login-sub">أدخل كلمة المرور للمتابعة</div>

        <form id="loginForm">
            <label class="form-label">كلمة المرور</label>
            <div class="input-wrap">
                <input type="password" class="form-control" id="password" placeholder="••••••••" autocomplete="current-password">
                <button type="button" class="toggle-eye" id="toggleEye">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <i class="bi bi-box-arrow-in-left"></i> دخول
            </button>

            <div class="msg" id="msg"></div>
        </form>

        <div class="login-footer">
            © 2026 Tenx <span style="color : yellow;">Plus</span> School - جميع الحقوق محفوظة
        </div>
    </div>

    <script>
        // ====== الوضع المظلم وتبديل الصورة ======
        const htmlEl = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const loginLogo = document.getElementById('loginLogo');

        // نقرأ مسارات الصور من data attributes
        const lightSrc = loginLogo.dataset.light;
        const darkSrc = loginLogo.dataset.dark;

        // دالة لتحديث الصورة حسب الوضع الحالي
        function updateLogo(theme) {
            loginLogo.src = (theme === 'dark') ? darkSrc : lightSrc;
        }

        // تحميل الوضع المحفوظ
        const savedTheme = localStorage.getItem('theme') || 'light';
        htmlEl.setAttribute('data-theme', savedTheme);
        themeIcon.className = savedTheme === 'dark' ? 'bi bi-moon-stars' : 'bi bi-sun';
        updateLogo(savedTheme);   // تعيين الصورة الأولية حسب الوضع

        // زر تبديل الوضع
        themeToggle.addEventListener('click', () => {
            const next = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            htmlEl.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            themeIcon.className = next === 'dark' ? 'bi bi-moon-stars' : 'bi bi-sun';
            updateLogo(next);     // تغيير الصورة فوراً
        });

        // ====== عناصر الصفحة ======
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const passwordInput = document.getElementById('password');
        const msg = document.getElementById('msg');
        const toggleEye = document.getElementById('toggleEye');
        const eyeIcon = document.getElementById('eyeIcon');

        // ====== إظهار/إخفاء كلمة المرور ======
        toggleEye.addEventListener('click', () => {
            const isPass = passwordInput.type === 'password';
            passwordInput.type = isPass ? 'text' : 'password';
            eyeIcon.className = isPass ? 'bi bi-eye-slash' : 'bi bi-eye';
        });

        // ====== تسجيل الدخول ======
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = passwordInput.value;

            // التحقق من الإدخال
            if (!password) {
                msg.className = 'msg error';
                msg.textContent = 'أدخل كلمة المرور أولاً';
                return;
            }

            // تعطيل الزر أثناء التحقق
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> جاري التحقق...';
            msg.className = 'msg';
            msg.textContent = '';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await response.json();

                if (data.success) {
                    msg.className = 'msg success';
                    msg.textContent = 'تم التحقق بنجاح، جاري التحويل...';
                    setTimeout(() => window.location.href = '/home', 600);
                } else {
                    msg.className = 'msg error';
                    msg.textContent = 'كلمة المرور غير صحيحة';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (error) {
                msg.className = 'msg error';
                msg.textContent = 'تعذر الاتصال بالسيرفر، تحقق من الشبكة';
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-left"></i> دخول';
            }
        });

        // التركيز التلقائي على حقل كلمة المرور
        passwordInput.focus();
    </script>
</body>
</html>
